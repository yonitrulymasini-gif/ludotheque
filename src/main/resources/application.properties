spring.application.name=ludotheque
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ludotheque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ludotheque}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ludotheque}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true